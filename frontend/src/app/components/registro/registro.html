<div class="container d-flex justify-content-center align-items-center vh-100">
  <div class="card p-4 shadow" style="width: 400px;">
    <h2 class="text-center mb-4">Crear Cuenta</h2>
    
    <form (ngSubmit)="onRegistro()">
      <div class="mb-3">
        <label for="nombre" class="form-label">Nombre Completo</label>
        <input type="text" class="form-control" id="nombre" name="nombre" [(ngModel)]="usuario.nombre" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Correo Electrónico</label>
        <input type="email" class="form-control" id="email" name="email" [(ngModel)]="usuario.email" required>
      </div>
      
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" name="password" [(ngModel)]="usuario.password" required>
      </div>

      <button type="submit" class="btn btn-success w-100">Registrarse</button>
    </form>
    
    <div class="text-center mt-3">
      <p>¿Ya tienes cuenta? <a routerLink="/login">Inicia Sesión aquí</a></p>
    </div>
  </div>
</div>
