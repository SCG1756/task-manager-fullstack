<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold text-white mb-0">Mis Tareas</h2>
    <button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Formulario para crear tarea -->
  <div class="card mb-4 shadow-sm">
    <div class="card-body">
      <form (ngSubmit)="crearTarea()">
        <div class="row">
          <div class="col-md-5 mb-2">
            <input type="text" class="form-control" placeholder="Título de la tarea" [(ngModel)]="nuevaTarea.titulo" name="titulo" required>
          </div>
          <div class="col-md-5 mb-2">
            <input type="text" class="form-control" placeholder="Descripción" [(ngModel)]="nuevaTarea.descripcion" name="descripcion">
          </div>
          <div class="col-md-2 mb-2">
            <button type="submit" class="btn btn-primary w-100">Agregar</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Lista de tareas -->
  <div class="row">
    <div class="col-md-12" *ngFor="let tarea of tareas">
      <div class="card mb-2 shadow-sm">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <h5 class="card-title mb-1" [class.text-decoration-line-through]="tarea.estado === 'completada'">
              {{ tarea.titulo }}
            </h5>
            <p class="card-text text-muted mb-0">{{ tarea.descripcion }}</p>
            <span class="badge mt-2" 
                  [ngClass]="{'bg-warning text-dark': tarea.estado === 'pendiente', 'bg-success': tarea.estado === 'completada'}">
              {{ tarea.estado }}
            </span>
          </div>
          <div>
            <!-- Botón para cambiar el estado -->
            <button *ngIf="tarea.estado === 'pendiente'" class="btn btn-sm btn-success me-2" (click)="cambiarEstado(tarea)">
              Completar
            </button>
            <button class="btn btn-sm btn-outline-danger" (click)="eliminarTarea(tarea.id)">Eliminar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
